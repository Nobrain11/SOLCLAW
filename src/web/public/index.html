<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SOL CLAW — Terminal</title>
  <meta name="theme-color" content="#0b0f14" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">🐾</span>
        <div>
          <div class="brand-name">SOL CLAW</div>
          <div class="brand-sub">Pump.fun · Solana</div>
        </div>
      </div>
      <div class="topbar-mid">
        <span id="sol-price" class="sol-pill">◎ SOL —</span>
      </div>
      <div class="topbar-right">
        <button type="button" id="btn-connect" class="btn connect">Connect</button>
        <div id="wallet-menu" class="wallet-menu hidden">
          <button type="button" data-wallet="phantom">Phantom</button>
          <button type="button" data-wallet="solflare">Solflare</button>
          <button type="button" data-wallet="backpack">Backpack</button>
        </div>
      </div>
    </header>

    <nav class="main-tabs" role="tablist">
      <button type="button" class="main-tab active" data-view="discover">Discover</button>
      <button type="button" class="main-tab" data-view="pulse">Pulse</button>
      <button type="button" class="main-tab" data-view="tracker">Tracker</button>
      <button type="button" class="main-tab" data-view="portfolio">Portfolio</button>
      <button type="button" class="main-tab" data-view="settings">Settings</button>
    </nav>

    <section id="view-discover" class="view active">
      <div class="toolbar">
        <div class="seg tabs-feed" id="feed-tabs">
          <button type="button" class="seg-btn active" data-tab="top">Top</button>
          <button type="button" class="seg-btn" data-tab="trending">Trending</button>
          <button type="button" class="seg-btn" data-tab="viewed">Most Viewed</button>
          <button type="button" class="seg-btn" data-tab="surge">Surge</button>
          <button type="button" class="seg-btn" data-tab="watching">Watching</button>
        </div>
        <div class="seg tf" id="tf-tabs">
          <button type="button" class="seg-btn" data-tf="1m">1m</button>
          <button type="button" class="seg-btn active" data-tf="5m">5m</button>
          <button type="button" class="seg-btn" data-tf="30m">30m</button>
          <button type="button" class="seg-btn" data-tf="1h">1h</button>
          <button type="button" class="seg-btn" data-tf="24h">24h</button>
        </div>
        <button type="button" id="btn-refresh" class="btn ghost sm" title="Refresh">↻</button>
      </div>

      <div class="table-head desktop-only">
        <div class="col token">Token</div>
        <div class="col age">Age</div>
        <div class="col mcap">MC</div>
        <div class="col liq">Liq</div>
        <div class="col vol">Vol</div>
        <div class="col txns">Txns</div>
        <div class="col trend">Trend</div>
        <div class="col safety">Safety</div>
        <div class="col action">Buy</div>
      </div>

      <div id="token-list" class="token-list" aria-live="polite"></div>
    </section>

    <section id="view-pulse" class="view">
      <div class="toolbar">
        <div class="seg"><button class="seg-btn active">New pairs</button></div>
        <button type="button" id="btn-refresh-pulse" class="btn ghost sm">↻</button>
      </div>
      <div id="pulse-list" class="token-list"></div>
    </section>

    <section id="view-tracker" class="view">
      <div class="pad">
        <h2 class="h2">Wallet tracker</h2>
        <div class="row">
          <input id="track-input" class="input grow" placeholder="Solana address" autocomplete="off" />
          <button type="button" id="btn-add-track" class="btn primary">Add</button>
        </div>
        <div id="track-list" class="token-list"></div>
      </div>
    </section>

    <section id="view-portfolio" class="view">
      <div class="pad portfolio">
        <div class="muted">Connected</div>
        <div id="pf-addr" class="addr">—</div>
        <div class="pf-grid">
          <div><span class="muted">Balance</span><strong id="pf-sol">—</strong></div>
          <div><span class="muted">Network</span><strong>Solana</strong></div>
        </div>
        <p class="muted sm">Extension wallet or bot-managed wallet via Telegram.</p>
      </div>
    </section>

    <section id="view-settings" class="view">
      <div class="pad">
        <h2 class="h2">Settings</h2>
        <label class="field">Default buy
          <select id="buy-preset" class="input">
            <option value="0.05">0.05 SOL</option>
            <option value="0.1" selected>0.1 SOL</option>
            <option value="0.25">0.25 SOL</option>
            <option value="0.5">0.5 SOL</option>
          </select>
        </label>
        <label class="field">Slippage
          <select id="slip-preset" class="input">
            <option value="5">5%</option>
            <option value="10">10%</option>
            <option value="15">15%</option>
            <option value="20" selected>20%</option>
          </select>
        </label>
      </div>
    </section>

    <div id="sheet" class="sheet hidden" role="dialog">
      <div class="sheet-backdrop" data-close></div>
      <div class="sheet-panel">
        <button type="button" class="sheet-back" data-close>← Return</button>
        <div id="sheet-body"></div>
      </div>
    </div>
  </div>
  <script src="/app.js" type="module"></script>
</body>
</html>
