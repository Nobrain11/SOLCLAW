<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SOL CLAW — Auto-Hunter</title>
<style>
  @import url('https://cdnjs.cloudflare.com/ajax/libs/inter-ui/3.19.3/inter.css');
  :root{
    --bg:#08080b; --panel:#111116; --panel2:#16161c; --border:#1f1f28;
    --text:#eceef2; --dim:#82828f; --dimmer:#54545f;
    --green:#2ee68a; --greenSoft:#0e2118; --red:#ff5c6c; --redSoft:#2a1418;
    --amber:#e6b93a; --amberSoft:#2a2110; --accent:#5b8cff;
    --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; background:#000; font-family:'Inter',-apple-system,sans-serif; overflow:hidden; color:var(--text);}
  .phone{width:100%; max-width:430px; margin:0 auto; background:var(--bg); height:100vh; height:100dvh; display:flex; flex-direction:column; position:relative; overflow:hidden;}
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:calc(var(--safeT) + 10px) 16px 12px; border-bottom:1px solid var(--border); flex-shrink:0;}
  .brand{display:flex; align-items:center; gap:8px; font-weight:800; font-size:16px;}
  .brand a{color:inherit; text-decoration:none;}
  .brand .dot{width:9px;height:9px;border-radius:3px;background:var(--green); box-shadow:0 0 8px var(--green); animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1} 50%{opacity:.4}}
  .balancepill{display:flex; align-items:center; gap:8px; background:var(--panel2); border:1px solid var(--border); border-radius:20px; padding:7px 12px; font-size:13px; color:var(--dim);}
  .balancepill b{color:var(--text); font-variant-numeric:tabular-nums;}
  .content{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:calc(96px + var(--safeB));}
  .content::-webkit-scrollbar{display:none;}
  .page{animation:slideIn .28s cubic-bezier(.22,1,.36,1); padding-bottom:8px;}
  @keyframes slideIn{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)}}
  .section{margin:14px 16px; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px;}
  .section-title{font-size:12px; letter-spacing:1px; color:var(--dim); text-transform:uppercase; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between;}
  .badge{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:800; padding:4px 10px; border-radius:12px;}
  .badge.hunting{background:var(--greenSoft); color:var(--green);}
  .badge.paused{background:var(--amberSoft); color:var(--amber);}
  .badge.locked{background:var(--redSoft); color:var(--red);}
  .badge.killed{background:#1a1a20; color:var(--dimmer);}
  .badge .b-dot{width:6px;height:6px;border-radius:50%; background:currentColor; animation:pulse 1.4s infinite;}
  .hunter-card{margin:14px 16px; background:linear-gradient(160deg,#0e1a14,#0d1013); border:1px solid #1e4433; border-radius:16px; padding:18px; position:relative; overflow:hidden;}
  .hunter-card::before{content:''; position:absolute; top:-40px; right:-40px; width:140px; height:140px; background:radial-gradient(circle,#2ee68a22,transparent 70%);}
  .hunter-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .hunter-title{font-weight:800; font-size:16px;}
  .statline{display:flex; justify-content:space-between; font-size:13px; padding:7px 0; border-bottom:1px solid #1a2620; font-variant-numeric:tabular-nums;}
  .statline:last-of-type{border-bottom:none;}
  .statline .lbl{color:var(--dim);}
  .statline .val{font-weight:700;}
  .barwrap{height:5px; background:#1a2620; border-radius:3px; margin:8px 0 4px; overflow:hidden;}
  .barfill{height:100%; background:var(--green); border-radius:3px; transition:width .4s;}
  .hunter-actions{display:flex; gap:8px; margin-top:14px;}
  .hbtn{flex:1; text-align:center; padding:11px 4px; border-radius:10px; font-weight:700; font-size:13px; border:1px solid var(--border); background:var(--panel2); color:var(--text); cursor:pointer;}
  .hbtn:active{transform:scale(.96);}
  .hbtn.primary{background:var(--green); color:#04150d; border:none;}
  .hbtn.kill{background:var(--redSoft); color:var(--red); border-color:#3a1a1e;}
  .modal-overlay{position:absolute; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(3px); z-index:60; display:flex; align-items:flex-end;}
  .modal-overlay.hidden{display:none;}
  .modal{width:100%; background:var(--panel); border-top:1px solid var(--border); border-radius:20px 20px 0 0; padding:20px; padding-bottom:calc(28px + var(--safeB));}
  .modal-handle{width:36px; height:4px; background:var(--border); border-radius:2px; margin:0 auto 16px;}
  .modal h3{margin:0 0 8px; font-size:17px;}
  .modal p{color:var(--dim); font-size:13.5px; line-height:1.5; margin:0 0 4px;}
  .modal .warn{color:var(--amber); font-size:12.5px; margin-top:10px; padding:10px; background:var(--amberSoft); border-radius:10px;}
  .modal-actions{display:flex; gap:10px; margin-top:18px;}
  .modal-actions button{flex:1; padding:13px; border-radius:11px; font-weight:700; font-size:14px; border:1px solid var(--border); background:var(--panel2); color:var(--text); cursor:pointer;}
  .modal-actions .enable{background:var(--green); color:#04150d; border:none;}
  .hunt-row{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px dashed #1a1a22; font-size:13px; gap:8px;}
  .hunt-row:last-child{border-bottom:none;}
  .hunt-token{font-weight:700; font-family:ui-monospace,monospace;}
  .hunt-age{color:var(--dimmer); font-size:12px; flex-shrink:0;}
  .hstate{font-size:10px; font-weight:800; padding:3px 8px; border-radius:8px; letter-spacing:.3px; flex-shrink:0;}
  .hstate.scanning,.hstate.SCANNING{background:#16202a; color:var(--accent);}
  .hstate.filtering,.hstate.FILTERING{background:var(--amberSoft); color:var(--amber);}
  .hstate.rejected,.hstate.REJECTED{background:#1a1a20; color:var(--dimmer);}
  .hstate.ready,.hstate.READY,.hstate.ENTERED{background:var(--greenSoft); color:var(--green);}
  .empty{text-align:center; color:var(--dim); font-size:14px; padding:48px 20px;}
  .bottomnav{position:absolute; bottom:calc(14px + var(--safeB)); left:14px; right:14px; background:rgba(22,22,28,.9); border:1px solid var(--border); border-radius:24px; display:flex; justify-content:space-around; padding:10px 4px; backdrop-filter:blur(16px); z-index:10;}
  .navitem{display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--dim); font-size:10.5px; font-weight:600; background:none; border:none; cursor:pointer; padding:2px 6px;}
  .navitem.active{color:var(--green); transform:translateY(-2px);}
  .navicon{font-size:18px;}
  .toastwrap{position:absolute; top:calc(var(--safeT) + 56px); left:14px; right:14px; z-index:70; pointer-events:none;}
  .toast{background:var(--panel2); border:1px solid #1e4433; border-radius:14px; padding:12px 14px; margin-bottom:8px; display:flex; align-items:center; gap:10px;}
  .toast-text{font-size:13px; font-weight:600; line-height:1.35;}
  .toast-text b{color:var(--green);}
  .status-chip{display:inline-flex; font-size:11px; font-weight:700; padding:4px 10px; border-radius:12px; background:var(--greenSoft); color:var(--green);}
  .backlink{font-size:12px; color:var(--dim); text-decoration:none; margin-right:8px;}
</style>
</head>
<body>
<div class="phone">
  <div class="topbar">
    <div class="brand">
      <a class="backlink" href="/">←</a>
      <span class="dot"></span> SOL CLAW
    </div>
    <div class="balancepill">◎ <b id="solBal">—</b></div>
  </div>
  <div class="toastwrap" id="toastwrap"></div>
  <div class="content" id="content"></div>

  <div class="modal-overlay hidden" id="confirmModal">
    <div class="modal">
      <div class="modal-handle"></div>
      <h3>⚡ Enable Auto-Hunter?</h3>
      <p>Trades automatically on pump.fun curve tokens that pass filters.</p>
      <p>Daily loss cap: <b style="color:var(--text)">0.5 SOL</b> · Max exposure: <b style="color:var(--text)">25%</b></p>
      <div class="warn">⚠️ Risk of loss. Trades execute without further confirmation once armed.</div>
      <div class="modal-actions">
        <button type="button" id="cancelEnable">Cancel</button>
        <button type="button" class="enable" id="confirmEnable">Enable Auto-Hunter</button>
      </div>
    </div>
  </div>

  <div class="bottomnav">
    <button type="button" class="navitem active" data-tab="dashboard"><span class="navicon">🏠</span>Dashboard</button>
    <button type="button" class="navitem" data-tab="terminal"><span class="navicon">🎯</span>Terminal</button>
    <button type="button" class="navitem" data-tab="scanner"><span class="navicon">🔎</span>Scanner</button>
    <button type="button" class="navitem" data-tab="portfolio"><span class="navicon">📊</span>Portfolio</button>
  </div>
</div>

<script>
const state = {
  ok: false,
  hunterEnabled: false,
  status: 'OFF',
  walletConnected: false,
  regime: 'UNKNOWN',
  successRate: null,
  dailyPnl: 0,
  dailyLoss: 0,
  lossCap: 0.5,
  entriesHour: 0, maxHour: 3,
  entriesDay: 0, maxDay: 10,
  exposure: 0, maxExposure: 25,
  openPositions: 0,
  candidates: [],
  logs: [],
  solPrice: null,
};

async function api(path, body) {
  const opts = { credentials: 'same-origin', headers: {} };
  if (body !== undefined) {
    opts.method = 'POST';
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  return res.json().catch(() => ({ ok: false }));
}

function toast(html, ok=true){
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span>${ok?'🟢':'⏭️'}</span><span class="toast-text">${html}</span>`;
  document.getElementById('toastwrap').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function statusBadge(){
  const st = state.status;
  if (st === 'HUNTING') return `<span class="badge hunting"><span class="b-dot"></span>HUNTING</span>`;
  if (st === 'LOCKED') return `<span class="badge locked"><span class="b-dot"></span>LOCKED</span>`;
  if (st === 'PAUSED') return `<span class="badge paused"><span class="b-dot"></span>PAUSED</span>`;
  if (st === 'KILLED') return `<span class="badge killed"><span class="b-dot"></span>KILLED</span>`;
  return `<span class="badge killed"><span class="b-dot"></span>OFF</span>`;
}

function ageLabel(sec){
  if (sec == null) return '—';
  if (sec < 60) return sec + 's';
  if (sec < 3600) return Math.floor(sec/60) + 'm';
  return Math.floor(sec/3600) + 'h';
}

function applyDash(d){
  if (!d) return;
  state.ok = d.ok !== false;
  state.hunterEnabled = !!d.enabled || d.status === 'HUNTING';
  state.status = d.status || 'OFF';
  state.walletConnected = !!d.walletConnected;
  state.regime = d.marketRegime || 'UNKNOWN';
  state.successRate = d.regimeSuccessPct;
  state.dailyPnl = Number(d.dailyPnlSol) || 0;
  state.dailyLoss = Number(d.dailyLossSol) || 0;
  state.lossCap = Number(d.dailyLossCap) || 0.5;
  state.entriesHour = Number(d.entriesHour) || 0;
  state.maxHour = Number(d.maxEntriesHour) || 3;
  state.entriesDay = Number(d.entriesToday) || 0;
  state.maxDay = Number(d.maxEntriesDay) || 10;
  state.exposure = Number(d.exposureSol) || 0;
  state.maxExposure = Number(d.maxExposurePct) || 25;
  state.openPositions = Number(d.openAutoPositions) || 0;
  state.candidates = Array.isArray(d.candidates) ? d.candidates : [];
  state.logs = Array.isArray(d.logs) ? d.logs : [];
}

async function refresh(){
  try {
    const d = await api('/api/hunter/status');
    applyDash(d);
  } catch (e) { console.warn(e); }
  try {
    const sol = await api('/api/sol-price');
    if (sol && sol.price != null) {
      state.solPrice = sol.price;
      const el = document.getElementById('solBal');
      if (el) el.textContent = Number(sol.price).toFixed(2);
    }
  } catch {}
}

function renderDashboard(){
  const lossUsed = Math.max(0, state.dailyLoss);
  const barPct = Math.min(100, (lossUsed / (state.lossCap || 0.5)) * 100);
  const pnlColor = state.dailyPnl >= 0 ? 'var(--green)' : 'var(--red)';
  const decisions = (state.logs || []).filter(l => l.kind === 'skip' || l.kind === 'entry').slice(0, 8);

  return `<div class="page">
    <div class="hunter-card">
      <div class="hunter-head">
        <div class="hunter-title">⚡ Auto-Hunter</div>
        ${statusBadge()}
      </div>
      <div class="statline"><span class="lbl">Daily PnL</span><span class="val" style="color:${pnlColor}">${state.dailyPnl>=0?'+':''}${state.dailyPnl.toFixed(3)} SOL</span></div>
      <div class="statline"><span class="lbl">Loss Cap</span><span class="val">${lossUsed.toFixed(2)} / ${state.lossCap} SOL</span></div>
      <div class="barwrap"><div class="barfill" style="width:${barPct}%"></div></div>
      <div class="statline"><span class="lbl">Entries</span><span class="val">${state.entriesHour} / ${state.maxHour} hour</span></div>
      <div class="statline"><span class="lbl">Today</span><span class="val">${state.entriesDay} / ${state.maxDay}</span></div>
      <div class="statline"><span class="lbl">Exposure</span><span class="val">${state.exposure.toFixed(2)} SOL · max ${state.maxExposure}%</span></div>
      <div class="statline"><span class="lbl">Open auto</span><span class="val">${state.openPositions}</span></div>
      <div class="statline"><span class="lbl">Market Regime</span><span class="val">${state.regime}</span></div>
      <div class="hunter-actions">
        <button type="button" class="hbtn primary" id="openTerminalBtn">Open Terminal</button>
        ${state.hunterEnabled
          ? `<button type="button" class="hbtn" id="pauseBtn">Pause</button><button type="button" class="hbtn kill" id="killBtn">Kill Auto</button>`
          : `<button type="button" class="hbtn" id="enableBtn" style="flex:2;">Enable Auto-Hunter</button>`
        }
      </div>
    </div>
    <div class="section">
      <div class="section-title">Last Decisions</div>
      ${decisions.length === 0
        ? '<div style="color:var(--dim);font-size:13px;text-align:center;padding:12px;">No decisions yet</div>'
        : decisions.map(d => `
        <div class="hunt-row">
          <span class="hunt-token">$${d.ticker || '?'}</span>
          <span style="color:var(--dim); font-size:12px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${d.message || ''}</span>
          <span class="hstate ${d.kind === 'entry' ? 'ENTERED' : 'REJECTED'}">${(d.kind || '').toUpperCase()}</span>
        </div>`).join('')}
    </div>
  </div>`;
}

function renderTerminal(){
  if (!state.hunterEnabled && state.status !== 'HUNTING'){
    return `<div class="page">
      <div class="empty">Auto-Hunter is off.<br>Enable it from the Dashboard to stream live candidates.</div>
    </div>`;
  }
  const feed = state.candidates.length
    ? state.candidates
    : state.logs.filter(l => l.mint).slice(0, 12).map(l => ({
        ticker: l.ticker, ageSec: null, status: l.kind === 'skip' ? 'REJECTED' : l.kind === 'entry' ? 'ENTERED' : 'FILTERING'
      }));

  return `<div class="page">
    <div class="section">
      <div class="section-title">Market Regime <span class="status-chip">${state.regime}</span></div>
      <div class="statline"><span class="lbl">Success Rate</span><span class="val">${state.successRate != null ? state.successRate + '%' : '—'}</span></div>
      <div class="statline"><span class="lbl">Entries</span><span class="val">${state.entriesHour} / ${state.maxHour} hour</span></div>
    </div>
    <div class="section">
      <div class="section-title">Live Token Hunt</div>
      ${feed.length === 0
        ? '<div style="color:var(--dim);font-size:13px;text-align:center;padding:16px;">Scanning pump.fun…</div>'
        : feed.map(f => `
        <div class="hunt-row">
          <span class="hunt-token">$${f.ticker || '?'}</span>
          <span class="hunt-age">${ageLabel(f.ageSec)}</span>
          <span class="hstate ${f.status}">${(f.status || '').toUpperCase()}</span>
        </div>`).join('')}
    </div>
  </div>`;
}

function renderScanner(){
  const feed = state.candidates.slice(0, 16);
  return `<div class="page">
    <div class="section">
      <div class="section-title">New Pairs — Bonding Curve</div>
      ${feed.length === 0
        ? '<div class="empty">Streaming from pump.fun…</div>'
        : feed.map(f => `
        <div class="hunt-row">
          <span class="hunt-token">$${f.ticker || '?'}</span>
          <span class="hunt-age">${ageLabel(f.ageSec)}</span>
          <span class="hstate ${f.status}">${(f.status || '').toUpperCase()}</span>
        </div>`).join('')}
    </div>
  </div>`;
}

function renderPortfolio(){
  return `<div class="page">
    <div class="section">
      <div class="section-title">Open Auto Positions</div>
      <div class="statline"><span class="lbl">Count</span><span class="val">${state.openPositions}</span></div>
      <div class="statline"><span class="lbl">Daily PnL</span><span class="val" style="color:${state.dailyPnl>=0?'var(--green)':'var(--red)'}">${state.dailyPnl>=0?'+':''}${state.dailyPnl.toFixed(3)} SOL</span></div>
      <p style="color:var(--dim);font-size:12px;margin:12px 0 0;">Manage positions in the <a href="/" style="color:var(--green)">main terminal</a>.</p>
    </div>
  </div>`;
}

const renderers = { dashboard: renderDashboard, terminal: renderTerminal, scanner: renderScanner, portfolio: renderPortfolio };
let currentTab = 'dashboard';

function switchTab(tab){
  currentTab = tab;
  document.getElementById('content').innerHTML = renderers[tab]();
  document.querySelectorAll('.navitem').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
  wireTab();
}

function wireTab(){
  document.getElementById('openTerminalBtn')?.addEventListener('click', () => switchTab('terminal'));
  document.getElementById('enableBtn')?.addEventListener('click', () => {
    if (!state.walletConnected) {
      toast('Create a wallet on the main app first', false);
      return;
    }
    document.getElementById('confirmModal').classList.remove('hidden');
  });
  document.getElementById('pauseBtn')?.addEventListener('click', async () => {
    await api('/api/hunter/pause', {});
    await refresh();
    toast('Auto-Hunter <b>paused</b>', false);
    switchTab(currentTab);
  });
  document.getElementById('killBtn')?.addEventListener('click', async () => {
    await api('/api/hunter/kill', {});
    await refresh();
    toast('🛑 Auto-Hunter killed', false);
    switchTab('dashboard');
  });
}

document.querySelectorAll('.navitem').forEach(el => {
  el.addEventListener('click', () => switchTab(el.dataset.tab));
});
document.getElementById('cancelEnable').addEventListener('click', () => {
  document.getElementById('confirmModal').classList.add('hidden');
});
document.getElementById('confirmEnable').addEventListener('click', async () => {
  document.getElementById('confirmModal').classList.add('hidden');
  const r = await api('/api/hunter/enable', { confirm: true });
  if (!r.ok) {
    toast(r.message || r.error || 'Enable failed', false);
    return;
  }
  await refresh();
  toast('⚡ Auto-Hunter <b>armed</b>', true);
  switchTab('dashboard');
});

(async function boot(){
  await refresh();
  switchTab('dashboard');
  setInterval(async () => {
    await refresh();
    if (document.getElementById('confirmModal').classList.contains('hidden')) {
      switchTab(currentTab);
    }
  }, 4000);
})();
</script>
</body>
</html>
